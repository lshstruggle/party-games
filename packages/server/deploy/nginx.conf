# ============================================================
#  聚好玩 · 多站 nginx 配置（party-games）
#  部署：复制到 /etc/nginx/sites-available/party-games.conf
#        然后 ln -s 到 sites-enabled，nginx -t && systemctl reload nginx
#  替换占位符：把下面所有的 YOUR_DOMAIN 改为你的主域名
#              （如 game.example.cloud；party / works 是子域，共用主域证书）
#  证书：默认用 certbot 路径；若用腾讯云免费证书，改 ssl_certificate / ssl_certificate_key 两行
# ============================================================

# ---------- 派对游戏站：party.YOUR_DOMAIN ----------
server {
    listen 443 ssl http2;
    server_name party.YOUR_DOMAIN;

    # SSL 证书（certbot 自动签发路径）
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    # 若用腾讯云免费证书，改成类似：
    # ssl_certificate     /etc/nginx/ssl/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 前端静态资源（vite 构建产物，部署时 cp 到 /var/www/party/dist）
    root /var/www/party/dist;
    index index.html;

    # SPA history fallback（react-router 用）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API 反代到 Node 服务
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket 反代（关键：Upgrade 头 + 超长超时，聚会一局可能几十分钟）
    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# ---------- 作品集：works.YOUR_DOMAIN ----------
server {
    listen 443 ssl http2;
    server_name works.YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 作品集静态文件（部署时 cp 到 /var/www/portfolio）
    root /var/www/portfolio;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------- HTTP → HTTPS 跳转 + certbot 验证 ----------
server {
    listen 80;
    server_name party.YOUR_DOMAIN works.YOUR_DOMAIN;

    # certbot 申请证书时的验证路径，保留
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
